
name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download project source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: pyinstaller
          pip install --no-build-isolation vgamepad==0.1.0

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --name JoystickAutoClicker main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: JoystickAutoClicker-Windows
          path: dist/JoystickAutoClicker.exe
