
name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: python -m pip install --only-binary=:all: pyinstaller

      - name: Install vgamepad
        run: python -m pip install --no-build-isolation vgamepad==0.1.0

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --onefile --windowed --name JoystickAutoClicker main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: JoystickAutoClicker-Windows
          path: dist/JoystickAutoClicker.exe
